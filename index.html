    <title>Adrien Lacourpaille</title>
    <!--
      A layer's position is fixed where its name first appears, and Vite injects
      stylesheets in module-graph order: declared here, the order cannot depend
      on which component happened to be imported first.
    -->
    <style>
      @layer reset, tokens, base, components;
    </style>

    <div id="root"></div>

  </body>

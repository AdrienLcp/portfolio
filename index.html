<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="#0f5257" data-scheme="light" data-token="--field-dominant" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#1b5a5e" data-scheme="dark" data-token="--field-dominant" media="(prefers-color-scheme: dark)" name="theme-color" />
    <style>
      :root[data-fonts-pending] #root {
        visibility: hidden;
      }
    </style>
    <script>
      if ('FontFace' in window) {
        const root = document.documentElement
        const reveal = () => delete root.dataset.fontsPending
        const longestFontWaitMs = 800

        root.dataset.fontsPending = ''
        setTimeout(reveal, longestFontWaitMs)
        Promise.all([
          new FontFace('Archivo', "url('/fonts/archivo-latin.woff2') format('woff2')", {
            stretch: '100% 125%',
            weight: '600 900'
          }).load(),
          new FontFace('Literata', "url('/fonts/literata-latin.woff2') format('woff2')", {
            weight: '400 700'
          }).load()
        ]).then(reveal, reveal)
      }
    </script>
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <title></title>
    <meta content="" name="description" />
    <link href="https://adrienlacourpaille.dev/" rel="canonical" />
    <meta content="website" property="og:type" />
    <meta content="Adrien Lacourpaille" property="og:site_name" />
    <meta content="" property="og:title" />
    <meta content="" property="og:description" />
    <meta content="https://adrienlacourpaille.dev/" property="og:url" />
    <meta content="https://adrienlacourpaille.dev/og.png" property="og:image" />
    <meta content="" property="og:image:width" />
    <meta content="" property="og:image:height" />
    <meta content="" property="og:image:alt" />
    <meta content="en_US" property="og:locale" />
    <meta content="fr_FR" property="og:locale:alternate" />
    <meta content="summary_large_image" name="twitter:card" />
    <style>
      @layer reset, tokens, base, components;
    </style>
    <script data-site="portfolio" defer src="https://analytics.adrienlcp.workers.dev/tracker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>

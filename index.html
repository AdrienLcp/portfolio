    <meta charset="UTF-8" />

    <meta content="#f7f8fa" data-scheme="light" data-token="--paper" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#101115" data-scheme="dark" data-token="--paper" media="(prefers-color-scheme: dark)" name="theme-color" />
    <style>
      :root[data-fonts-pending] #root {
        visibility: hidden;
      }
    </style>
    <script>
      if ('FontFace' in window) {
        const root = document.documentElement
        const reveal = () => delete root.dataset.fontsPending
        const longestFontWaitMs = 800

        root.dataset.fontsPending = ''
        setTimeout(reveal, longestFontWaitMs)
        Promise.all([
          new FontFace('Sofia Sans Condensed', "url('/fonts/sofia-sans-condensed-latin.woff2') format('woff2')", {
            weight: '300 900'
          }).load(),
          new FontFace('Sofia Sans', "url('/fonts/sofia-sans-latin.woff2') format('woff2')", {
            weight: '300 800'
          }).load()
        ]).then(reveal, reveal)
      }
    </script>

    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
